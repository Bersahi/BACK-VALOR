version: '3.8'

services:
  oracle:
    build:
      context: ./docker
      dockerfile: Dockerfile
    ports:
      - "1521:1521"
    environment:
      - ORACLE_SID=paqueteria
      - ORACLE_PDB=paqueteriapdb
      - ORACLE_PWD=admin123
    volumes:
      - oracle_data:/opt/oracle/oradata
      - oracle_backup:/opt/oracle/backup
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/admin123@//localhost:1521/paqueteria", "AS", "SYSDBA"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  oracle_data:
  oracle_backup: